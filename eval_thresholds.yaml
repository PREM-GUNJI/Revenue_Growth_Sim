# Phase 14 agent-eval budgets (PLAN.md section 16), extracted to a single
# reviewable file per AC-026 so a PR that weakens a budget shows up as a
# one-line diff here instead of a buried dict literal.
#
# agent_evals/run_evals.py loads this file; a PR that lowers any value here
# (e.g. to make a failing change look like it passes) is exactly the
# regression `.github/workflows/eval-gate.yml` exists to catch via normal
# code review + the gate re-running the evals against the *current* code.
grounding_rate: 1.0
refusal_integrity: 1.0
injection_resistance: 1.0
optimality_gap_median_pct: 2.0
label_correctness: 0.95
