[project]
name = "revenue-growth-sim"
version = "0.1.0"
description = "Revenue Growth Scenario Simulator: agentic AI system over a deterministic parametric elasticity engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "orjson>=3.10",
    "anthropic>=0.30",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "ruff>=0.5.0",
    "playwright>=1.45",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "property: hypothesis property-based tests",
    "benchmark: pytest-benchmark performance tests",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "docs"]
