services:
  api:
    image: revenue-growth-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  web:
    image: revenue-growth-web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
