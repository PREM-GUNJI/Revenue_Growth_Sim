name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: uv run pytest -q

  # Reporting job: runs on every push/PR and uploads the metrics report.
  # The dedicated required check for branch protection (AC-026) is the
  # separate `eval-gate` job in .github/workflows/eval-gate.yml, which runs
  # the same command and is named to match what reviewers require on merge.
  agent-evals:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra dev
      # Scripted fake LLM only (deterministic, offline, no API key) per CLAUDE.md phase 10-13 rule.
      # Hard gate: all five PLAN.md section 16 budgets (grounding, refusal integrity,
      # injection resistance, optimality gap, label correctness) are met (DEFECTS.md #11-12,
      # fixed in Phase 14) so run_evals.py's non-zero exit on a missed budget fails the job.
      - name: agent evals (scripted LLM)
        run: uv run python -m agent_evals.run_evals --report reports/agent_evals.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-evals-report
          path: reports/agent_evals.json

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits, not just the diff
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - name: bandit (static analysis)
        run: uv run bandit -r backend -c pyproject.toml
      - name: pip-audit (dependency vulnerabilities)
        run: uv run pip-audit
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only required for org-owned repos; unused on personal accounts
