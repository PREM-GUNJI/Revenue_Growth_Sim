name: Clean clone demo

# AC-025: a clean clone of the repository reaches a running demo (API + UI)
# using two documented commands (see README.md "Quickstart"). This workflow
# IS that proof: it runs those same two commands against a fresh checkout
# with no cached state, headlessly (`uv run python -m tasks demo-check`
# starts the API, polls /healthz + /assumptions, then builds the frontend
# instead of leaving a dev server running forever in CI).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-clone-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Command 1 (documented in README "Quickstart"): bring up the backend.
      - name: uv sync (bootstrap, as documented)
        run: uv sync --extra dev
      # Command 2 (documented in README "Quickstart"): bring up the UI.
      # demo-check runs the headless equivalent of both documented commands
      # (serve + frontend) so the job terminates instead of hanging on a dev server.
      - name: demo-check (headless clean-clone proof)
        run: uv run python -m tasks demo-check
